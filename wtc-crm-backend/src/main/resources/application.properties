server.port=8080

# MongoDB — pode sobrescrever com variável MONGODB_URI no .env ou no sistema
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wtccrm}

jwt.secret=${JWT_SECRET:your_jwt_secret_key_here_replace_in_prod}
jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# Google / Firebase (valores típicos no .env na raiz do repositório — ver DotenvBootstrap)
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:}
google.cloud.project-number=${GOOGLE_CLOUD_PROJECT_NUMBER:}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

firebase.config.path=classpath:firebase-service-account.json
websocket.allowed.origins=*

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
